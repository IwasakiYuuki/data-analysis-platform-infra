---
- name: Create keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: ansible_os_family == "Debian"

- name: Add Kubernetes GPG key (modern method)
  get_url:
    url: https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: '0644'
  when: ansible_os_family == "Debian"

- name: Add Kubernetes repository (modern method)
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/ /"
    state: present
  when: ansible_os_family == "Debian"

- name: Update apt packages after adding repo
  apt:
    update_cache: yes
  when: ansible_os_family == "Debian"

# - name: Check available Kubernetes versions
#   shell: apt-cache madison kubelet | head -5

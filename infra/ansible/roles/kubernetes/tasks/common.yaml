#   failed_when: false

# - name: Display available Kubernetes versions
#   debug:
#     msg: "Available kubelet versions: {{ available_kubelet_versions.stdout_lines }}"
#   when: ansible_os_family == "Debian" and available_kubelet_versions.stdout_lines is defined

- name: Install Kubernetes packages
  apt:
    name:
      - "kubelet={{ kubernetes_full_version }}"
      - "kubeadm={{ kubernetes_full_version }}"
      - "kubectl={{ kubernetes_full_version }}"
    state: present
    allow_downgrade: yes
  when: ansible_os_family == "Debian"

- name: Hold Kubernetes packages
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl
  when: ansible_os_family == "Debian"

- name: Enable kubelet service
  systemd:
    name: kubelet
    enabled: yes
    state: started

- name: Create kubelet configuration directory
  file:
    path: /etc/systemd/system/kubelet.service.d
    state: directory
    mode: '0755'

- name: Configure kubelet extra args
  template:
    src: 10-kubeadm.conf.j2
    dest: /etc/systemd/system/kubelet.service.d/10-kubeadm.conf
    mode: '0644'
  notify: reload systemd and restart kubelet
